<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Tracker — Settings</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --gridline: #e1e0d9; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --gridline: #2c2c2a; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
  .topbar strong { font-size: 15px; }
  .topbar nav { display: flex; gap: 14px; margin-left: 20px; }
  .topbar nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; }
  .topbar nav a.active { color: var(--text-primary); font-weight: 600; }
  .who { font-size: 12px; color: var(--text-secondary); }
  #signOut { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); margin: 0 0 4px; font-weight: 600; }
  .card p.hint { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--text-secondary); padding: 0 6px 8px; }
  td { padding: 5px 6px; }
  td input {
    width: 100%; padding: 7px 8px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px;
  }
  td.limitCol { width: 130px; }
  .rmBtn {
    background: none; border: none; color: var(--critical); cursor: pointer; font-size: 15px; padding: 4px 6px;
  }

  .btnRow { display: flex; gap: 8px; margin-top: 14px; }
  #addRowBtn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px; cursor: pointer;
  }
  #saveBtn {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: var(--s1); color: white; font-size: 13px; cursor: pointer;
  }
  #settingsStatus { font-size: 12px; color: var(--text-secondary); margin-top: 10px; min-height: 16px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 16px 0; text-align: center; }
</style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex; align-items:center">
      <strong>Budget Tracker</strong>
      <nav>
        <a href="home.html">Home</a>
        <a href="settings.html" class="active">Settings</a>
      </nav>
    </div>
    <div style="display:flex; align-items:center; gap:12px">
      <span class="who" id="who"></span>
      <button id="signOut">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>Categories &amp; budgets</h2>
      <p class="hint">Add, rename, or remove categories, and set an optional monthly budget for each. Leave the limit blank for no budget.</p>
      <table id="catTable">
        <thead><tr><th>Category</th><th class="limitCol">Monthly limit (₹)</th><th></th></tr></thead>
        <tbody id="catBody"></tbody>
      </table>
      <div class="btnRow">
        <button id="addRowBtn">+ Add category</button>
        <button id="saveBtn">Save changes</button>
      </div>
      <div id="settingsStatus"></div>
    </div>
  </div>

<script type="module">
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth } from "./firebase-config.js";
import { getAccessToken, readCategories, writeCategories, clearAccessTokenCache } from "./sheets-api.js";

const catBody = document.getElementById('catBody');
const statusEl = document.getElementById('settingsStatus');
let spreadsheetId = null;
let token = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  document.getElementById('who').textContent = user.email || user.displayName || '';

  spreadsheetId = localStorage.getItem('bt_spreadsheetId_' + user.uid);
  if (!spreadsheetId) {
    statusEl.textContent = 'Connect Google Sheets from Home first.';
    return;
  }

  try {
    token = await getAccessToken({ interactive: false });
    const rows = await readCategories(token, spreadsheetId);
    renderRows(rows.length ? rows : [{ category: '', limit: '' }]);
  } catch (e) {
    statusEl.textContent = 'Could not load categories — go to Home to reconnect, then come back.';
  }
});

document.getElementById('signOut').addEventListener('click', () => { clearAccessTokenCache(); signOut(auth); });

function renderRows(rows) {
  catBody.innerHTML = '';
  rows.forEach(addRow);
}

function addRow(row = { category: '', limit: '' }) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="catName" value="${escapeAttr(row.category)}" placeholder="e.g. Food"></td>
    <td class="limitCol"><input type="number" step="0.01" class="catLimit" value="${escapeAttr(row.limit)}" placeholder="no limit"></td>
    <td><button class="rmBtn" title="Remove">✕</button></td>
  `;
  tr.querySelector('.rmBtn').addEventListener('click', () => {
    const name = tr.querySelector('.catName').value.trim();
    if (name && !confirm(`Remove "${name}"? Existing transactions keep this label but it won't be selectable for new ones.`)) return;
    tr.remove();
  });
  catBody.appendChild(tr);
}

function escapeAttr(v) { return String(v ?? '').replace(/"/g, '&quot;'); }

document.getElementById('addRowBtn').addEventListener('click', () => addRow());

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!spreadsheetId) { statusEl.textContent = 'Connect Google Sheets from Home first.'; return; }
  const rows = [...catBody.querySelectorAll('tr')].map(tr => ({
    category: tr.querySelector('.catName').value.trim(),
    limit: tr.querySelector('.catLimit').value.trim(),
  })).filter(r => r.category);

  const names = rows.map(r => r.category.toLowerCase());
  if (new Set(names).size !== names.length) {
    statusEl.textContent = 'Category names must be unique.';
    return;
  }

  statusEl.textContent = 'Saving…';
  try {
    token = await getAccessToken({ interactive: false });
    await writeCategories(token, spreadsheetId, rows);
    renderRows(rows.length ? rows : [{ category: '', limit: '' }]);
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 1500);
  } catch (e) {
    statusEl.textContent = e.message || 'Could not save — try again.';
  }
});
</script>
</body>
</html>
