<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Tracker — Sign in</title>
<style>
  :root {
    color-scheme: dark;
    --page: #000000; --surface-1: #121317; --surface-2: #191b21;
    --text-primary: #ffffff; --text-secondary: #b7bac5; --text-muted: #7a7e8c;
    --border: rgba(255,255,255,0.09);
    --accent: #3b82f6; --accent-hover: #2f6fe0; --accent-glow: rgba(59,130,246,0.35);
    --s1: #3987e5; --critical: #e66767;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(600px circle at 50% -10%, rgba(59,130,246,0.16), transparent 60%),
      var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: 320px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 24px;
    box-shadow: 0 0 0 1px rgba(59,130,246,0.06), 0 24px 60px rgba(0,0,0,0.6);
  }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; letter-spacing: -0.01em; }
  p.sub { color: var(--text-secondary); font-size: 13px; text-align: center; margin: 0 0 22px; }

  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-primary); font-size: 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .google-btn:hover { border-color: var(--accent); background: #1d2028; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  label { display: block; font-size: 12px; color: var(--text-secondary); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-primary); font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #primaryBtn {
    width: 100%; margin-top: 16px; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 16px var(--accent-glow); transition: background .15s, transform .1s;
  }
  #primaryBtn:hover { background: var(--accent-hover); }
  #primaryBtn:active { transform: translateY(1px); }
  #primaryBtn:disabled { opacity: .6; cursor: default; box-shadow: none; }
  .toggle { text-align: center; margin-top: 14px; font-size: 13px; color: var(--text-secondary); }
  .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #err { color: var(--critical); font-size: 12px; text-align: center; min-height: 16px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Budget Tracker</h1>
    <p class="sub">Your spending, your own Google Sheet.</p>

    <button class="google-btn" id="googleBtn">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.5-.2-3-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5c-7.6 0-14.1 4.3-17.4 10.6l-.3-.4z"/><path fill="#4CAF50" d="M24 45.5c5.4 0 10.3-1.9 14-5.6l-6.4-5.2c-2 1.5-4.7 2.4-7.6 2.4-5.3 0-9.8-3.3-11.4-8l-6.6 5C9.8 40.9 16.4 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.7-2.6 5-4.7 6.6l6.4 5.2C40.8 36.6 44.5 31.4 44.5 25c0-1.5-.2-3-.4-4.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" minlength="6">
      <button type="submit" id="primaryBtn">Sign in</button>
    </form>

    <div class="toggle" id="toggleText">
      New here? <a id="toggleLink">Create an account</a>
    </div>
    <div id="err"></div>
  </div>

<script type="module">
import {
  signInWithPopup, GoogleAuthProvider,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth } from "./firebase-config.js";

const errEl = document.getElementById('err');
const form = document.getElementById('authForm');
const primaryBtn = document.getElementById('primaryBtn');
const toggleLink = document.getElementById('toggleLink');
const toggleText = document.getElementById('toggleText');
let mode = 'signin'; // or 'signup'

onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = 'home.html';
});

document.getElementById('googleBtn').addEventListener('click', async () => {
  errEl.textContent = '';
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
    // onAuthStateChanged above handles the redirect
  } catch (e) {
    errEl.textContent = friendlyError(e);
  }
});

toggleLink.addEventListener('click', () => {
  mode = mode === 'signin' ? 'signup' : 'signin';
  primaryBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  toggleText.innerHTML = mode === 'signin'
    ? 'New here? <a id="toggleLink">Create an account</a>'
    : 'Already have an account? <a id="toggleLink">Sign in</a>';
  document.getElementById('toggleLink').addEventListener('click', () => toggleLink.click());
  errEl.textContent = '';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  primaryBtn.disabled = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    if (mode === 'signin') {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      await createUserWithEmailAndPassword(auth, email, password);
    }
  } catch (e2) {
    errEl.textContent = friendlyError(e2);
  } finally {
    primaryBtn.disabled = false;
  }
});

function friendlyError(e) {
  const code = e.code || '';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Incorrect email or password.';
  if (code.includes('email-already-in-use')) return 'That email already has an account — sign in instead.';
  if (code.includes('weak-password')) return 'Password must be at least 6 characters.';
  if (code.includes('popup-closed-by-user')) return '';
  return 'Something went wrong: ' + code.replace('auth/', '');
}
</script>
</body>
</html>
